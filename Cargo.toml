[package]
name = "dholman-site"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
pulldown-cmark = "0.13.0"
web-sys = { version = "0.3.82", features = ["Window", "Document", "HtmlElement"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1

